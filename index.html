<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蕉大王的成长记录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        memphis: {
                            pink: '#FF6B6B',
                            yellow: '#FFE66D',
                            teal: '#4ECDC4',
                            purple: '#9B59B6',
                            dark: '#374151',
                        }
                    },
                    fontFamily: {
                        display: ['Fredoka', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Fredoka', -apple-system, sans-serif;
            background: #FFFDE7;
            min-height: 100vh;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }
        @keyframes bounce-slow {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes spin-slow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .float-animation {
            animation: float 4s ease-in-out infinite;
        }
        .bounce-animation {
            animation: bounce-slow 2s ease-in-out infinite;
        }

        /* 食物卡片hover效果 */
        .food-card {
            transform: rotate(var(--rotate, 0deg));
            transition: all 0.3s ease;
        }

        .food-card:hover {
            transform: rotate(calc(var(--rotate, 0deg) * -1)) scale(1.03);
            box-shadow: 8px 8px 0 #374151;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 核心配置
        const BIRTH_DATE = '2025-10-25';
        const BABY_PHOTO_URL = 'https://jiaojiao-1257740345.cos.ap-nanjing.myqcloud.com/px_live_cover_BB088B3C-04E4-4CFD-BE3A-BCD54ED40EF8_L0_001_IMG_3070.jpg';

        // JSON数据加载函数
        async function loadData() {
            try {
                const response = await fetch('./jiaojiao.json');
                if (!response.ok) throw new Error('数据加载失败');
                const data = await response.json();
                console.log('✅ 数据加载成功');
                return data;
            } catch (error) {
                console.error('数据加载错误：', error);
                return null;
            }
        }

        // 查询指定日期的数据（测试用：2026-06-06）
        function getTodayData(jsonData) {
            const today = '2026-06-06'; // 测试用固定日期

            // 今日喂养
            const feeding = jsonData.data.feeding
                .filter(item => item.start_time && item.start_time.startsWith(today))
                .sort((a, b) => b.start_time.localeCompare(a.start_time))
                .map(item => [item.start_time, item.end_time, item.duration_min, item.type]);

            // 今日睡眠
            const sleep = jsonData.data.sleep
                .filter(item => item.start_time && item.start_time.startsWith(today))
                .sort((a, b) => b.start_time.localeCompare(a.start_time))
                .map(item => [item.start_time, item.end_time, item.duration_min]);

            // 今日尿布
            const diaper = jsonData.data.diaper_change
                .filter(item => item.datetime && item.datetime.startsWith(today))
                .sort((a, b) => b.datetime.localeCompare(a.datetime))
                .map(item => [item.datetime, item.has_poop, item.has_pee, item.note]);

            // 今日辅食
            const food = jsonData.data.solid_food
                .filter(item => item.start_time && item.start_time.startsWith(today))
                .sort((a, b) => b.start_time.localeCompare(a.start_time))
                .map(item => [item.start_time, item.food_name, item.amount_g]);

            // 最近体重
            const weightData = jsonData.data.weight
                .sort((a, b) => b.date.localeCompare(a.date))[0];
            const weight = weightData ? [weightData.date, weightData.weight_kg, weightData.height_cm] : null;

            return { feeding, sleep, diaper, food, weight };
        }

        // 孟菲斯装饰组件
        const MemphisDot = ({ className, color = 'bg-memphis-pink', size = 'w-4 h-4' }) => (
            <div className={`absolute rounded-full ${color} ${size} ${className}`} />
        );

        const MemphisTriangle = ({ className, color = 'border-memphis-purple' }) => (
            <div
                className={`absolute ${className}`}
                style={{
                    width: 0,
                    height: 0,
                    borderLeft: '10px solid transparent',
                    borderRight: '10px solid transparent',
                    borderBottom: `18px solid ${color.includes('#') ? color : '#9B59B6'}`,
                }}
            />
        );

        const MemphisStar = ({ className, color = '#FFE66D' }) => (
            <svg width="24" height="24" viewBox="0 0 24 24" fill={color} className={`absolute ${className}`}>
                <path d="M12 2L14.5 9L22 9.5L16.5 14L18.5 22L12 18L5.5 22L7.5 14L2 9.5L9.5 9L12 2Z"/>
            </svg>
        );

        const MENU_SECTIONS = [
            { key: 'dishes', title: '菜肴', bg: 'bg-[#F97316]', titleClass: 'text-white', rotate: '-2deg', fallbackEmoji: '🍲' },
            { key: 'staples', title: '主食面点', bg: 'bg-[#22C55E]', titleClass: 'text-white', rotate: '2deg', fallbackEmoji: '🍚' },
            { key: 'porridge', title: '粥糊汤', bg: 'bg-[#4ECDC4]', titleClass: 'text-memphis-dark', rotate: '-2deg', fallbackEmoji: '🥣' },
            { key: 'snacks', title: '零食加餐', bg: 'bg-memphis-yellow', titleClass: 'text-memphis-dark', rotate: '2deg', fallbackEmoji: '🍪' },
        ];

        function menuItemsOf(categories, key) {
            if (!categories || !Array.isArray(categories[key])) return [];
            return categories[key].filter(food => food != null && food !== '');
        }

        function menuItemView(food, fallbackEmoji) {
            if (typeof food === 'string') {
                return { emoji: fallbackEmoji, name: food };
            }
            if (food && typeof food === 'object') {
                return {
                    emoji: food.emoji || fallbackEmoji,
                    name: food.name || ''
                };
            }
            return { emoji: fallbackEmoji, name: '' };
        }

        // 主页面
        const BabyPage = () => {
            const [days, setDays] = useState(0);
            const [db, setDb] = useState(null);
            const [todayData, setTodayData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [allergenFoods, setAllergenFoods] = useState(null);
            const [allergenView, setAllergenView] = useState('ingredients');
            const [menuFoods, setMenuFoods] = useState(null);
            const [showNameStory, setShowNameStory] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            const [wishes, setWishes] = useState([]);
            const [wishCategories, setWishCategories] = useState([]);
            const [wishSearch, setWishSearch] = useState('');
            const [wishCategoryFilter, setWishCategoryFilter] = useState('all');
            const [wishStatusFilter, setWishStatusFilter] = useState('all');
            const [showCompletedWishes, setShowCompletedWishes] = useState(true);
            const [wishFormOpen, setWishFormOpen] = useState(false);
            const [wishFormTitle, setWishFormTitle] = useState('');
            const [wishFormDescription, setWishFormDescription] = useState('');
            const [wishFormCategoryId, setWishFormCategoryId] = useState('');
            const [editingWish, setEditingWish] = useState(null);
            const [wishManagerOpen, setWishManagerOpen] = useState(false);
            const [categoryDraftName, setCategoryDraftName] = useState('');
            const [categoryDraftColor, setCategoryDraftColor] = useState('#FFE66D');
            const [editingCategoryId, setEditingCategoryId] = useState(null);
            const [isWishesVerified, setIsWishesVerified] = useState(false);
            const [wishesPassword, setWishesPassword] = useState('');
            const [verifyError, setVerifyError] = useState('');
            const [wishError, setWishError] = useState('');
            const [isWishReorderMode, setIsWishReorderMode] = useState(false);
            const [draggedWishId, setDraggedWishId] = useState(null);
            const [dragOrderIds, setDragOrderIds] = useState([]);
            const [dragPoint, setDragPoint] = useState(null);
            const [isSavingWishOrder, setIsSavingWishOrder] = useState(false);
            const dragOrderRef = useRef([]);
            const dragStartOrderRef = useRef([]);
            const dragStateRef = useRef(null);
            const edgeScrollRef = useRef({ raf: null, velocity: 0 });

            const wishColors = ['#FF6B6B', '#4ECDC4', '#9B59B6', '#FFE66D', '#A7F3D0', '#FDBA74', '#93C5FD', '#F9A8D4', '#C4B5FD', '#CBD5E1'];

            // NAS API 地址（支持外网访问）
            const API_BASE_URL = 'https://1bg25629542vd.vicp.fun';

            // 从NAS API获取排敏食物
            const fetchAllergenFoods = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/allergen-foods`);
                    const data = await response.json();

                    // 直接使用后端返回的数据（已包含emoji）
                    return data.categories;
                } catch (error) {
                    console.error('获取排敏食物失败：', error);
                    return null;
                }
            };

            // 从同一个 NAS API 获取菜单
            const fetchMenuFoods = async () => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/menu-foods`);
                    if (!response.ok) throw new Error('菜单加载失败');
                    const data = await response.json();
                    const categories = data && data.categories;
                    if (!categories || typeof categories !== 'object' || Array.isArray(categories)) {
                        return {};
                    }
                    return categories;
                } catch (error) {
                    console.error('获取菜单失败：', error);
                    return null;
                }
            };

            // 从JSON数据解析排敏食物
            const parseAllergenFoods = (jsonData) => {
                try {
                    // 获取所有辅食记录
                    const solidFoodRecords = jsonData.data.solid_food || [];

                    // 提取所有食材（按+号分割）
                    const allIngredients = new Set();
                    solidFoodRecords.forEach(item => {
                        if (item.food_name && item.food_name !== '辅食内容') {
                            const foods = item.food_name.split('+');
                            foods.forEach(food => {
                                // 去掉"泥"后缀，只保留核心食材名
                                const cleaned = food.replace(/泥/g, '').trim();
                                if (cleaned) allIngredients.add(cleaned);
                            });
                        }
                    });

                    // 按类别分类
                    const categorized = {
                        grains: [],
                        vegetables: [],
                        protein: [],
                        oils: []
                    };

                    allIngredients.forEach(ingredient => {
                        // 检查属于哪个类别
                        for (const [category, items] of Object.entries(categoryRules)) {
                            if (items.includes(ingredient)) {
                                categorized[category].push({
                                    name: ingredient,
                                    emoji: foodEmojiMap[ingredient] || '🍽️'
                                });
                                break;
                            }
                        }
                    });

                    return categorized;
                } catch (error) {
                    console.error('解析排敏食物失败：', error);
                    return null;
                }
            };

            useEffect(() => {
                // 计算天数
                const birth = new Date(BIRTH_DATE);
                const today = new Date();
                const diff = Math.ceil((today - birth) / (1000 * 60 * 60 * 24)) + 1;
                setDays(diff);

                // 加载数据
                async function init() {
                    console.log('🔄 开始加载数据...');

                    // 从NAS API获取排敏食物和菜单
                    const [foods, menus] = await Promise.all([
                        fetchAllergenFoods(),
                        fetchMenuFoods()
                    ]);
                    if (foods) {
                        setAllergenFoods(foods);
                        console.log('🥦 排敏食物：', foods);
                    } else {
                        console.error('❌ 获取排敏食物失败');
                    }
                    if (menus) {
                        setMenuFoods(menus);
                        console.log('🍽️ 菜单：', menus);
                    } else {
                        console.error('❌ 获取菜单失败');
                    }

                    setLoading(false);
                }
                init();

            }, []);

            // 计算月龄
            const calculateAge = () => {
                const birth = new Date(BIRTH_DATE);
                const today = new Date();
                let months = today.getFullYear() * 12 + today.getMonth() - birth.getFullYear() * 12 - birth.getMonth();
                let days = today.getDate() - birth.getDate();
                if (days < 0) {
                    months--;
                    const lastMonth = new Date(today.getFullYear(), today.getMonth(), 0);
                    days += lastMonth.getDate();
                }
                return { months, days };
            };

            // 获取星座
            const getZodiac = () => {
                const month = new Date(BIRTH_DATE).getMonth() + 1;
                const day = new Date(BIRTH_DATE).getDate();
                const zodiac = [
                    [1, 20, '♑', '摩羯座'], [2, 19, '♒', '水瓶座'], [3, 20, '♓', '双鱼座'],
                    [4, 20, '♈', '白羊座'], [5, 21, '♉', '金牛座'], [6, 21, '♊', '双子座'],
                    [7, 23, '♋', '巨蟹座'], [8, 23, '♌', '狮子座'], [9, 23, '♍', '处女座'],
                    [10, 23, '♎', '天秤座'], [11, 22, '♏', '天蝎座'], [12, 22, '♐', '射手座']
                ];
                for (const [m, d, emoji, name] of zodiac) {
                    if (month === m && day >= d) return { emoji, name };
                    if (month === m - 1 && day < d) return { emoji, name };
                }
                return { emoji: '♏', name: '天蝎座' };
            };

            // 获取生肖
            const getChineseZodiac = () => {
                const year = new Date(BIRTH_DATE).getFullYear();
                const animals = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
                const emojis = ['🐭', '🐮', '🐯', '🐰', '🐲', '🐍', '🐴', '🐑', '🐵', '🐔', '🐶', '🐷'];
                const index = (year - 4) % 12;
                return { name: animals[index], emoji: emojis[index] };
            };

            // 月龄信息
            const age = calculateAge();
            const zodiac = getZodiac();
            const chineseZodiac = getChineseZodiac();

            // 获取心愿列表与主题
            const handleWishUnauthorized = (message = '密码错误') => {
                setIsWishesVerified(false);
                setWishes([]);
                setWishCategories([]);
                setVerifyError(message);
            };

            const fetchWishes = async (password = wishesPassword) => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/wishes`, {
                        headers: { 'X-Wishes-Password': password }
                    });
                    if (response.status === 401 || response.status === 429) {
                        const data = await response.json();
                        handleWishUnauthorized(data.error || '密码错误');
                        return false;
                    }
                    if (!response.ok) throw new Error('获取心愿失败');
                    setWishes(await response.json());
                    return true;
                } catch (error) {
                    console.error('获取心愿失败：', error);
                    setVerifyError('暂时无法连接心愿服务');
                    return false;
                }
            };

            const fetchWishCategories = async (password = wishesPassword) => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/wish-categories`, {
                        headers: { 'X-Wishes-Password': password }
                    });
                    if (response.status === 401 || response.status === 429) {
                        const data = await response.json();
                        handleWishUnauthorized(data.error || '密码错误');
                        return false;
                    }
                    if (!response.ok) throw new Error('获取主题失败');
                    setWishCategories(await response.json());
                    return true;
                } catch (error) {
                    console.error('获取主题失败：', error);
                    setWishError('主题加载失败，请稍后重试');
                    return false;
                }
            };

            const loadWishData = async (password = wishesPassword) => {
                const wishesLoaded = await fetchWishes(password);
                if (!wishesLoaded) return false;
                return fetchWishCategories(password);
            };

            const resetWishForm = () => {
                setWishFormOpen(false);
                setEditingWish(null);
                setWishFormTitle('');
                setWishFormDescription('');
                const uncategorized = wishCategories.find(category => category.name === '未分类');
                setWishFormCategoryId(uncategorized ? String(uncategorized.id) : '');
                setWishError('');
            };

            const openWishForm = (wish = null) => {
                setEditingWish(wish);
                setWishFormTitle(wish ? wish.title : '');
                setWishFormDescription(wish ? (wish.description || '') : '');
                const defaultCategory = wish?.category_id || wishCategories.find(category => category.name === '未分类')?.id || wishCategories[0]?.id || '';
                setWishFormCategoryId(String(defaultCategory));
                setWishFormOpen(true);
                setWishError('');
            };

            const saveWish = async () => {
                if (!wishFormTitle.trim()) {
                    setWishError('请先写下心愿内容');
                    return;
                }
                const categoryId = Number(wishFormCategoryId);
                try {
                    const endpoint = editingWish ? `${API_BASE_URL}/api/wishes/${editingWish.id}` : `${API_BASE_URL}/api/wishes`;
                    const response = await fetch(endpoint, {
                        method: editingWish ? 'PUT' : 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Wishes-Password': wishesPassword
                        },
                        body: JSON.stringify({
                            title: wishFormTitle.trim(),
                            description: wishFormDescription.trim(),
                            categoryId: Number.isInteger(categoryId) && categoryId > 0 ? categoryId : null,
                            completed: editingWish ? (editingWish.completed ? 1 : 0) : 0
                        })
                    });
                    if (response.status === 401 || response.status === 429) {
                        const data = await response.json();
                        handleWishUnauthorized(data.error || '密码错误');
                        return;
                    }
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(data.error || '保存心愿失败');
                    resetWishForm();
                    await loadWishData();
                } catch (error) {
                    console.error('保存心愿失败：', error);
                    setWishError(error.message || '保存心愿失败');
                }
            };

            const toggleWish = async (wish) => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/wishes/${wish.id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Wishes-Password': wishesPassword
                        },
                        body: JSON.stringify({
                            title: wish.title,
                            description: wish.description || '',
                            categoryId: wish.category_id,
                            priority: wish.priority || 0,
                            completed: wish.completed ? 0 : 1
                        })
                    });
                    if (response.status === 401 || response.status === 429) {
                        const data = await response.json();
                        handleWishUnauthorized(data.error || '密码错误');
                        return;
                    }
                    if (!response.ok) throw new Error('更新心愿失败');
                    await fetchWishes();
                } catch (error) {
                    console.error('更新心愿失败：', error);
                }
            };

            const toggleFeaturedWish = async (wish) => {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/wishes/${wish.id}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Wishes-Password': wishesPassword
                        },
                        body: JSON.stringify({ isFeatured: wish.is_featured ? 0 : 1 })
                    });
                    if (response.status === 401 || response.status === 429) {
                        const data = await response.json();
                        handleWishUnauthorized(data.error || '密码错误');
                        return;
                    }
                    if (!response.ok) throw new Error('更新重点心愿失败');
                    await fetchWishes();
                } catch (error) {
                    console.error('更新重点心愿失败：', error);
                    setWishError('重点状态更新失败，请稍后重试');
                }
            };

            const stopEdgeScroll = () => {
                const edgeScroll = edgeScrollRef.current;
                edgeScroll.velocity = 0;
                if (edgeScroll.raf) cancelAnimationFrame(edgeScroll.raf);
                edgeScroll.raf = null;
            };

            const resetActiveWishDrag = (restoreOrder = false) => {
                const pointer = dragStateRef.current;
                stopEdgeScroll();
                if (pointer) {
                    try { pointer.card.releasePointerCapture?.(pointer.pointerId); } catch {}
                }
                if (restoreOrder) {
                    dragOrderRef.current = [...dragStartOrderRef.current];
                    setDragOrderIds([...dragStartOrderRef.current]);
                }
                document.body.style.userSelect = '';
                setDraggedWishId(null);
                setDragPoint(null);
                dragStateRef.current = null;
            };

            const getWishById = (id) => wishes.find(item => item.id === id);

            const updateWishDropTarget = (pointer) => {
                const targetCard = document.elementFromPoint(pointer.currentX, pointer.currentY)?.closest('[data-wish-card-id]');
                if (!targetCard) return;
                const targetId = Number(targetCard.dataset.wishCardId);
                if (!Number.isInteger(targetId) || targetId === pointer.wishId) return;
                const targetWish = getWishById(targetId);
                const draggedWish = getWishById(pointer.wishId);
                if (!targetWish || !draggedWish
                    || !!targetWish.completed !== !!draggedWish.completed
                    || !!targetWish.is_featured !== !!draggedWish.is_featured) return;

                const remainingIds = dragOrderRef.current.filter(id => id !== pointer.wishId);
                const targetIndex = remainingIds.indexOf(targetId);
                if (targetIndex < 0) return;
                const targetRect = targetCard.getBoundingClientRect();
                const insertAfter = pointer.currentY > targetRect.top + targetRect.height / 2;
                remainingIds.splice(targetIndex + (insertAfter ? 1 : 0), 0, pointer.wishId);
                if (remainingIds.join(',') === dragOrderRef.current.join(',')) return;
                dragOrderRef.current = remainingIds;
                setDragOrderIds(remainingIds);
            };

            const runEdgeScroll = () => {
                const edgeScroll = edgeScrollRef.current;
                const pointer = dragStateRef.current;
                if (!pointer?.active || !edgeScroll.velocity) {
                    edgeScroll.raf = null;
                    return;
                }
                window.scrollBy(0, edgeScroll.velocity);
                updateWishDropTarget(pointer);
                edgeScroll.raf = requestAnimationFrame(runEdgeScroll);
            };

            const updateEdgeScroll = (clientY) => {
                const edge = 104;
                const distanceFromTop = clientY;
                const distanceFromBottom = window.innerHeight - clientY;
                let velocity = 0;
                if (distanceFromTop < edge) velocity = -Math.max(3, Math.round((edge - distanceFromTop) / 5));
                if (distanceFromBottom < edge) velocity = Math.max(3, Math.round((edge - distanceFromBottom) / 5));
                edgeScrollRef.current.velocity = Math.max(-20, Math.min(20, velocity));
                if (edgeScrollRef.current.velocity && !edgeScrollRef.current.raf) {
                    edgeScrollRef.current.raf = requestAnimationFrame(runEdgeScroll);
                }
                if (!edgeScrollRef.current.velocity) stopEdgeScroll();

            const enterWishReorderMode = () => {
                if (!manualOrderEnabled || isSavingWishOrder || wishes.length < 2) return;
                const orderedIds = wishes.map(wish => wish.id);
                dragOrderRef.current = orderedIds;
                dragStartOrderRef.current = orderedIds;
                setDragOrderIds(orderedIds);
                setShowCompletedWishes(true);
                setIsWishReorderMode(true);
                setWishError('');

            const cancelWishReorder = () => {

            const saveWishReorder = async () => {
                if (isSavingWishOrder || !isWishReorderMode) return;
                resetActiveWishDrag();
                const groups = [
                    [0, 1], [0, 0], [1, 1], [1, 0]

                    completed,
                    isFeatured,
                    orderedIds: dragOrderRef.current.filter(id => {
                        const wish = getWishById(id);
                        return wish && !!wish.completed === !!completed && !!wish.is_featured === !!isFeatured;

                setIsSavingWishOrder(true);

                try {
                    const response = await fetch(`${API_BASE_URL}/api/wishes/reorder`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Wishes-Password': wishesPassword

                        body: JSON.stringify({ groups })

                        throw new Error(data.error || '密码错误');

                    if (!response.ok) throw new Error(data.error || '排序保存失败');

                    if (!loaded) throw new Error('排序已保存，但心愿列表刷新失败，请稍后重试');
                    setIsWishReorderMode(false);
                    setWishError('');
                    saved = true;
                    navigator.vibrate?.(18);

                    console.error('保存心愿顺序失败：', error);
                    setWishError(error.message || '排序保存失败，请重试');

                        setDragOrderIds([]);
                        dragOrderRef.current = [];
                        dragStartOrderRef.current = [];

                if (event.target?.closest?.('button, input, select, textarea, a')) return;
                const card = event.currentTarget;
                const rect = card.getBoundingClientRect();
                const pointer = {
                    pointerId: event.pointerId,
                    wishId: wish.id,
                    card,
                    currentX: event.clientX,
                    currentY: event.clientY,
                    active: true,
                    offsetY: event.clientY - rect.top,
                    left: rect.left,
                    width: rect.width

                event.preventDefault();
                dragStateRef.current = pointer;
                dragStartOrderRef.current = [...dragOrderRef.current];
                card.setPointerCapture?.(event.pointerId);

                pointer.currentY = event.clientY;

                                                    </div>
                                                    <div className="flex items-center gap-1.5 mt-3 pl-10">
                                                        <span className="inline-block text-xs px-2.5 py-1 rounded-full text-memphis-dark font-medium" style={{ backgroundColor: draggedWish.category_color || '#E5E7EB' }}>{draggedWish.category}</span>
                                                        {!!draggedWish.is_featured && <span className="inline-block text-xs px-2 py-1 rounded-full bg-pink-100 text-memphis-pink font-semibold">★ 重点</span>}
                                                    </div>
                                                </div>
                                            );
                                        })()}
                                    </>
                                )}
                        </div>
                        )}

                        {/* 查询Tab */}
                        {activeTab === 'query' && (
                            <div style={{ animation: 'fadeInUp 0.3s ease-out' }}>
                                <h2 className="text-xl font-bold text-memphis-dark mb-6">🔍 查询历史记录</h2>
                                <div className="bg-white rounded-3xl p-6 border-3 border-memphis-dark shadow-[6px_6px_0_#374151] text-center"
                                    style={{ borderWidth: '3px' }}>
                                    <div className="text-4xl mb-4">📊</div>
                                    <p className="text-gray-500 font-medium">功能开发中</p>
                                    <p className="text-sm text-gray-400 mt-2">历史记录查询功能即将上线...</p>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 底部Tab导航栏 */}
                    <div className={`fixed bottom-0 left-0 right-0 z-50 pb-2 transition-opacity duration-150 ${isWishReorderMode ? 'opacity-0 pointer-events-none' : ''}`} style={{ paddingBottom: 'max(8px, env(safe-area-inset-bottom))' }}>
                        <div className="px-5 max-w-md mx-auto">
                            <div className="bg-white rounded-2xl border-2 border-memphis-dark shadow-[4px_4px_0_#374151] overflow-hidden">
                                <div className="flex">
                                    {[
                                        { id: 'home', icon: '🏠', label: '首页' },
                                        { id: 'allergen', icon: '🥦', label: '排敏' },
                                        { id: 'wish', icon: '💝', label: '心愿' },
                                        { id: 'query', icon: '🔍', label: '查询' },
                                    ].map(tab => (
                                        <button
                                            key={tab.id}
                                            onClick={() => setActiveTab(tab.id)}
                                            className={`flex-1 flex flex-col items-center py-2.5 transition-all duration-200 ${
                                                activeTab === tab.id
                                                    ? 'bg-memphis-yellow text-memphis-dark'
                                                    : 'text-gray-500 hover:bg-gray-50'
                                            }`}
                                        >
                                            <span className="text-lg mb-0.5">{tab.icon}</span>
                                            <span className="text-[10px] font-semibold">{tab.label}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 渲染
        ReactDOM.createRoot(document.getElementById('root')).render(<BabyPage />);
    </script>
</body>
</html>
